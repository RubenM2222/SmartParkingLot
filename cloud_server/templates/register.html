<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registo de Park Admin</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

h2,h3,h4{
    margin-top:0;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    cursor:pointer;
    border:none;
    border-radius:5px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.parque{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-top:15px;
    background:#fafafa;
}

#token_info{
    margin-top:10px;
    font-weight:bold;
}

.token-ok{
    color:green;
}

.token-error{
    color:red;
}

</style>
</head>
<body>

<div class="container">

    <!-- TOKEN -->

    <div class="card">

        <h2>Registo de Park Admin</h2>

        <input
            id="token"
            placeholder="Token de registo">

        <div id="token_info"></div>

    </div>

    <!-- ADMIN -->

    <div class="card">

        <h3>Dados do Administrador</h3>

        <input
            id="nome"
            placeholder="Nome">

        <input
            id="username"
            placeholder="Username">

        <input
            id="password"
            type="password"
            placeholder="Password">

    </div>

    <!-- PARQUES -->

    <div class="card">

        <h3>Parques</h3>

        <div id="parques"></div>

        <button
            class="btn-primary"
            onclick="adicionarParque()">
            Adicionar Parque
        </button>

    </div>

    <!-- REGISTAR -->

    <div class="card">

        <button
            class="btn-success"
            onclick="registar()">
            Criar Conta
        </button>

    </div>

</div>

<script>

let parqueCount = 0;
let maxParques = 0;

/* =========================
   TOKEN
========================= */

document
    .getElementById("token")
    .addEventListener("blur", validarToken);

function validarToken() {

    const token =
        document.getElementById("token").value.trim();

    if (!token) {
        return;
    }

    fetch(`/token-info/${token}`)
    .then(r => r.json())
    .then(data => {

        const info =
            document.getElementById("token_info");

        if (!data.ok) {

            maxParques = 0;

            info.className = "token-error";

            info.innerHTML =
                "❌ Token inválido ou já utilizado";

            return;
        }

        maxParques = data.max_parques;

        info.className = "token-ok";

        info.innerHTML =
            `✅ Token válido (Máximo: ${maxParques} parque(s))`;

    })
    .catch(err => {

        console.error(err);

        document.getElementById("token_info").innerHTML =
            "Erro ao validar token";
    });
}

/* =========================
   PARQUES
========================= */

function adicionarParque() {

    if (maxParques === 0) {

        alert(
            "Introduza primeiro um token válido."
        );

        return;
    }

    if (parqueCount >= maxParques) {

        alert(
            `Este token permite apenas ${maxParques} parque(s).`
        );

        return;
    }

    parqueCount++;

    const div = document.createElement("div");

    div.className = "parque";

    div.innerHTML = `
        <h4>Parque ${parqueCount}</h4>

        <input
            class="p_nome"
            placeholder="Nome">

        <input
            class="p_localizacao"
            placeholder="Localização">

        <input
            class="p_capacidade"
            type="number"
            placeholder="Capacidade">

        <button
            class="btn-danger"
            onclick="removerParqueFormulario(this)">
            Remover Parque
        </button>
    `;

    document
        .getElementById("parques")
        .appendChild(div);
}

function removerParqueFormulario(btn) {

    btn.parentElement.remove();

    parqueCount--;
}

/* =========================
   REGISTAR
========================= */

function registar() {

    if (maxParques === 0) {

        alert("Token inválido.");

        return;
    }

    const parques = [];

    document
        .querySelectorAll(".parque")
        .forEach(div => {

            parques.push({

                nome:
                    div.querySelector(".p_nome").value,

                localizacao:
                    div.querySelector(".p_localizacao").value,

                capacidade:
                    parseInt(
                        div.querySelector(".p_capacidade").value
                    )
            });

        });

    if (parques.length === 0) {

        alert(
            "Tem de criar pelo menos um parque."
        );

        return;
    }

    fetch("/register", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            token:
                document.getElementById("token").value,

            nome:
                document.getElementById("nome").value,

            username:
                document.getElementById("username").value,

            password:
                document.getElementById("password").value,

            parques:
                parques
        })

    })
    .then(r => r.json())
    .then(data => {

        if(data.ok){

            alert(
                "Conta criada com sucesso."
            );

            window.location.href = "/login";
        }
        else{

            alert(
                data.msg ||
                "Erro ao criar conta"
            );
        }

    })
    .catch(err => {

        console.error(err);

        alert(
            "Erro de comunicação com o servidor"
        );
    });
}

</script>

</body>
</html>
