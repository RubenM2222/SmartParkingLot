<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento do Parque</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .card h2 {
            color: #333333;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .info-group {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            color: #666666;
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
        }

        .info-value {
            color: #111111;
            font-weight: 600;
            font-size: 16px;
        }

        .price-highlight {
            color: #2ecc71;
            font-size: 22px;
            font-weight: 700;
        }

        .btn-pagar {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-pagar:hover {
            background-color: #27ae60;
        }

        .btn-pagar:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Resumo do Pagamento</h2>
        
        <div class="info-group">
            <span class="info-label">Matrícula</span>
            <span class="info-value" id="matricula">{{ matricula }}</span>
        </div>

        <div class="info-group">
            <span class="info-label">Hora de Entrada</span>
            <span class="info-value">{{ entrada }}</span>
        </div>

        <div class="info-group">
            <span class="info-label">Hora de Saída</span>
            <span class="info-value">{{ saida }}</span>
        </div>

        <div class="info-group">
            <span class="info-label">Duração</span>
            <span class="info-value">{{ duracao }}</span>
        </div>

        <div class="info-group">
            <span class="info-label">Total a Pagar</span>
            <span class="info-value price-highlight">{{ preco }} €</span>
        </div>

        <button class="btn-pagar" onclick="processarPagamento()">Pagar Agora</button>
    </div>

    <script>
        function processarPagamento() {
            const matricula1 = document.getElementById('matricula').textContent;
            fetch(`/confirmar_pagamento?matricula=${matricula1}`, {
        method: 'POST'
    })
    .then(response => response.json())
    .then(data => {
        if (data.ok) {
            alert("Pagamento efetuado com sucesso em: " + data.data_pagamento);
            // Redirecionar para a página inicial ou atualizar a página
            window.location.href = "/"; 
        } else {
            alert("Erro: " + data.msg);
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        alert("Ocorreu um erro ao processar o pagamento.");
    });
        }
    </script>

</body>
</html>
