<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #1e293b, #0f172a);
        }

        .login-container {
            width: 380px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .title {
            text-align: center;

            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 28px;

            color: #0f172a;

            margin-bottom: 8px;
        }

        .title p {
            color: #64748b;

            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;
        }

        .input-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            margin-top: 15px;

            color: #dc2626;

            text-align: center;

            font-size: 14px;
        }

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="title">
        <h1>Smart Parking</h1>
        <p>Painel de Administração</p>
    </div>

    <div class="input-group">
        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Introduza o username"
        >
    </div>

    <div class="input-group">
        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Introduza a password"
        >
    </div>

    <button class="login-btn" onclick="login()">
        Entrar
    </button>

    <div class="error" id="error"></div>

    <div class="footer">
        Smart Parking System © 2026
    </div>

</div>

<script>

async function login() {

    const username = document.getElementById("username").value
    const password = document.getElementById("password").value

    const errorDiv = document.getElementById("error")

    errorDiv.innerText = ""

    try {

        const response = await fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password
            })
        })

        const data = await response.json()

        if (data.ok) {

            if (data.tipo === "server_admin") {

                window.location.href = "/admin/server"

            } else {

                window.location.href = "/admin/park"
            }

        } else {

            errorDiv.innerText = data.msg
        }

    } catch (err) {

        errorDiv.innerText = "Erro ao ligar ao servidor"
    }
}

</script>

</body>
</html>
