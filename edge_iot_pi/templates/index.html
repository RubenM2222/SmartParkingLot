<script>
// Obter o IP/hostname do servidor dinâmicamente
const SERVER_HOST = window.location.hostname;
const OCR_SERVER = `http://${SERVER_HOST}:5001`;
const PARKING_SERVER = `http://${SERVER_HOST}:5000`;
// const parqueId = 1; // ID do parque (pode ser dinâmico se tiver vários parques)

function enviar() {
    //Usar camera
    //const input = document.getElementById('camera');

    //Usar ficheiros do pc
    //const input = document.getElementById('imagem');

    //Usar camera ou ficheiros
    const inputCamera = document.getElementById('camera');
    const inputFile = document.getElementById('imagem');
    const parqueId = document.getElementById("parque_id").value;

    const input = inputCamera.files.length ? inputCamera : inputFile;
    if (input.files.length === 0) {
        alert("Escolhe uma imagem primeiro!");
        return;
    }
    
    const file = input.files[0];

    const formData = new FormData();
    formData.append('image', file);

    fetch(`${OCR_SERVER}/ocr?tipo=entrada&parque_id=${parqueId}`, {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        console.log("Resposta crua:", data);

        if (data.servidor && data.servidor.erro) {
            alert("Erro OCR/Cloud: " + data.servidor.erro);
            return;
        }

        alert(
            "Matricula: " + data.matricula +
            "\nServidor: " + JSON.stringify(data.servidor)
        );
    })
    .catch(err => {
        console.error(err);
        alert("Erro ao enviar entrada: " + err.message);
    });
    //.then(res => res.json())
    //.then(res => res.text()) 
    //.then(data => {
    //    alert("Texto: " + data.texto);
    //})
    //.catch(err => {
    //    console.error(err);
    //    alert("Erro ao enviar imagem");
    //});
}
function saida() {
    const inputCamera = document.getElementById('camera');
    const inputFile = document.getElementById('saidaImagem');
    const parqueId = document.getElementById("parque_id").value;

    const input = inputCamera.files.length ? inputCamera : inputFile;

    if (input.files.length === 0) {
        alert("Escolhe uma imagem primeiro!");
        return;
    }

    const file = input.files[0];

    const formData = new FormData();
    formData.append('image', file);

    fetch(`${OCR_SERVER}/ocr?tipo=saida&parque_id=${parqueId}`, {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        console.log("Resposta crua:", data);

        if (data.servidor && data.servidor.erro) {
            throw new Error("Erro OCR/Cloud: " + data.servidor.erro);
        }

        if (!data.matricula) {
            throw new Error("Matrícula não detectada na imagem.");
        }

        const resultado = data.servidor || {};
        if (!resultado.ok) {
            throw new Error(resultado.msg || "Erro na saída do servidor.");
        }

        alert(
            "✅ Saída registada!\\n\\n" +
            "Matrícula: " + data.matricula +
            "\\nDuração: " + resultado.tempo_min + " min" +
            "\\nPreço: " + resultado.preco + "€"
        );
    })
    .catch(err => {
        console.error(err);
        alert("Erro na saída: " + err.message);
    });
}
function reservar() {
    const matricula = document.getElementById("matriculaReserva").value;

    if (!matricula) {
        alert("Insere matrícula");
        return;
    }

    fetch(`${OCR_SERVER}/reservar`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ matricula })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.msg);
    })
    .catch(err => {
        console.error(err);
        alert("Erro na reserva");
    });
}
</script>
